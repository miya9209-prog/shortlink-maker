<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>클릭통계</title><style>body{font-family:Arial,'Noto Sans KR',sans-serif;background:#f7f7f7}.wrap{max-width:1000px;margin:30px auto;background:#fff;padding:24px;border-radius:18px}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #eee;padding:10px;text-align:left;font-size:13px}.muted{color:#777}</style></head><body><div class="wrap"><a href="/admin">← 관리자</a><h2>{{base_url}}/{{link.slug}}</h2><p>목적지: <a href="{{link.target_url}}">{{link.target_url}}</a></p><h3>총 클릭 {{total}}회</h3><table><thead><tr><th>시간</th><th>IP</th><th>User-Agent</th><th>Referer</th></tr></thead><tbody>{% for c in clicks %}<tr><td>{{c.clicked_at}}</td><td>{{c.ip}}</td><td class="muted">{{c.user_agent}}</td><td>{{c.referer}}</td></tr>{% endfor %}</tbody></table></div></body></html>
