<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Click Logs</title>
<style>body{font-family:Arial,'Noto Sans KR',sans-serif;background:#f7f7f7;margin:0;color:#222}.wrap{max-width:1100px;margin:0 auto;padding:28px}.card{background:white;border-radius:18px;padding:22px;box-shadow:0 6px 24px rgba(0,0,0,.06)}a.btn{padding:10px 14px;background:#111;color:#fff;border-radius:10px;text-decoration:none}.row{display:grid;grid-template-columns:160px 100px 130px 1fr;gap:12px;border-top:1px solid #eee;padding:10px 0;font-size:14px}.head{font-weight:700;color:#555}.ua{color:#777;font-size:12px;word-break:break-all}@media(max-width:800px){.row{grid-template-columns:1fr}}</style></head>
<body><div class="wrap"><p><a class="btn" href="/">관리자 홈</a></p><div class="card"><h2>최근 클릭 로그</h2><div class="row head"><div>시간</div><div>코드</div><div>기기</div><div>이동 URL / User-Agent</div></div>{% for c in clicks %}<div class="row"><div>{{ c.time }}</div><div>/{{ c.code }}</div><div>{{ c.device }}</div><div>{{ c.target_url }}<div class="ua">{{ c.user_agent }}</div></div></div>{% else %}<p>클릭 로그가 없습니다.</p>{% endfor %}</div></div></body></html>
