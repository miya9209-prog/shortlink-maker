<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>미샵 단축링크 로그인</title><style>body{font-family:Arial,'Noto Sans KR',sans-serif;background:#f6f6f6;margin:0}.box{max-width:420px;margin:12vh auto;background:white;padding:32px;border-radius:18px;box-shadow:0 8px 30px #0001}input,button{width:100%;padding:14px;margin-top:10px;border-radius:10px;border:1px solid #ddd;font-size:16px}button{background:#111;color:white;border:0;font-weight:700}.err{color:#c00}</style></head><body><div class="box"><h2>미샵 단축링크 관리자</h2><form method="post" action="/login"><input type="password" name="password" placeholder="관리자 비밀번호" autofocus><button>로그인</button></form>{% if error %}<p class="err">{{error}}</p>{% endif %}</div></body></html>
